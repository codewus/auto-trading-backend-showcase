name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew clean test --no-daemon
      - name: Verify executed test results
        env:
          RESULT_DIR: build/test-results/test
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path(os.environ['RESULT_DIR']).glob('TEST-*.xml'))
          assert files, 'No test reports were produced'
          suites = [ET.parse(f).getroot() for f in files]
          counts = {k: sum(int(s.get(k, '0')) for s in suites)
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          assert counts['tests'] > 0 and all(counts[k] == 0 for k in ('failures', 'errors', 'skipped')), counts
          print(counts)
          PYCODE

  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: showcase
          POSTGRES_DB: showcase
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U showcase -d showcase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew postgresTest --no-daemon
      - name: Verify executed test results
        env:
          RESULT_DIR: build/test-results/postgresTest
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path(os.environ['RESULT_DIR']).glob('TEST-*.xml'))
          assert files, 'No test reports were produced'
          suites = [ET.parse(f).getroot() for f in files]
          counts = {k: sum(int(s.get(k, '0')) for s in suites)
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          assert counts['tests'] > 0 and all(counts[k] == 0 for k in ('failures', 'errors', 'skipped')), counts
          print(counts)
          PYCODE
