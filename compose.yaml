name: auto-trading-backend-showcase
services:
  postgres:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    ports:
      - "127.0.0.1:${SHOWCASE_DB_PORT:-15432}:5432"
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: showcase
      # Dedicated loopback-only disposable demo database. No password/secret.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase -d showcase"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - showcase-data:/var/lib/postgresql/data
volumes:
  showcase-data:
